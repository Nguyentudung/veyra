[workspace]
members = [
    "app", "cache", "playback", "playlist", "scripting",
    "statistics", "ui", "utils", "video",
]
exclude = ["third_party/rune", "third_party/rune/**"]
resolver = "2"

[package]
name = "veyra"
version = "0.0.22"
edition = "2024"
license = "Apache-2.0"
description = "A focused native desktop media player built with Rust and Rune"

[dependencies]
veyra-app = { path = "app" }

[dev-dependencies]

[patch.crates-io]
winit = { path = "third_party/rune/vendor/winit" }
parley_engine = { path = "third_party/rune/vendor/parley_engine" }
accesskit_windows = { path = "third_party/rune/vendor/accesskit_windows" }
accesskit_macos = { path = "third_party/rune/vendor/accesskit_macos" }


